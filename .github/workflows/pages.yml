name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cherri
        run: |
          curl -fsSL -o cherri.zip https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip
          unzip -q cherri.zip
          chmod +x cherri

      - name: Inject patterns (private secret; falls back to public placeholder if unset)
        env:
          PATTERNS_CHERRI: ${{ secrets.PATTERNS_CHERRI }}
        run: |
          python3 - <<'PYEOF'
          import os, re
          src = "shortcuts/asa_jitaku_native.cherri"
          patterns = os.environ.get("PATTERNS_CHERRI", "").lstrip("\ufeff")
          text = open(src, encoding="utf-8").read()
          if patterns.strip():
              text = re.sub(
                  r"/\* PATTERNS_START \*/.*?/\* PATTERNS_END \*/",
                  "/* PATTERNS_START */\n" + patterns + "    /* PATTERNS_END */",
                  text, flags=re.S)
              print("patterns: injected from secret")
          else:
              print("patterns: secret not set, using public placeholder")
          open(src, "w", encoding="utf-8").write(text)
          PYEOF

      - name: Compile shortcut (unsigned)
        run: |
          mkdir -p site/shortcuts
          ./cherri shortcuts/asa_jitaku_native.cherri --skip-sign
          ls shortcuts/*_unsigned.shortcut

      - name: Fix missing WFWorkflowName and sign (HubSign)
        run: |
          UNSIGNED=$(ls shortcuts/*_unsigned.shortcut | head -n1)
          python3 tools/sign_hubsign.py --input "$UNSIGNED" --output shortcuts/asa-jitaku-native.shortcut --name AsaJitakuNative4
          test -s shortcuts/asa-jitaku-native.shortcut
          python3 -c "d=open('shortcuts/asa-jitaku-native.shortcut','rb').read(); assert d[:4]==b'AEA1', 'not a signed shortcut file'"
          rm -f shortcuts/*_unsigned.shortcut
          cp shortcuts/asa-jitaku-native.shortcut site/shortcuts/asa-jitaku-native.shortcut
          cd site/shortcuts && zip -q asa-jitaku-native.zip asa-jitaku-native.shortcut && cd -

      - name: Inject patterns for cards variant (private secret; falls back to public placeholder if unset)
        env:
          PATTERNS_CARDS_CHERRI: ${{ secrets.PATTERNS_CARDS_CHERRI }}
        run: |
          python3 - <<'PYEOF'
          import os, re
          src = "shortcuts/asa_jitaku_cards.cherri"
          patterns = os.environ.get("PATTERNS_CARDS_CHERRI", "").lstrip("\ufeff")
          text = open(src, encoding="utf-8").read()
          if patterns.strip():
              text = re.sub(
                  r"/\* PATTERNS_START \*/.*?/\* PATTERNS_END \*/",
                  "/* PATTERNS_START */\n" + patterns + "    /* PATTERNS_END */",
                  text, flags=re.S)
              print("cards patterns: injected from secret")
          else:
              print("cards patterns: secret not set, using public placeholder")
          open(src, "w", encoding="utf-8").write(text)
          PYEOF

      - name: Compile cards shortcut (unsigned)
        run: |
          ./cherri shortcuts/asa_jitaku_cards.cherri --skip-sign
          ls shortcuts/*_unsigned.shortcut

      - name: Fix missing WFWorkflowName and sign cards variant (HubSign)
        run: |
          UNSIGNED=$(ls shortcuts/*_unsigned.shortcut | head -n1)
          python3 tools/sign_hubsign.py --input "$UNSIGNED" --output shortcuts/asa-jitaku-cards.shortcut --name AsaJitakuCards1
          test -s shortcuts/asa-jitaku-cards.shortcut
          python3 -c "d=open('shortcuts/asa-jitaku-cards.shortcut','rb').read(); assert d[:4]==b'AEA1', 'not a signed shortcut file'"
          rm -f shortcuts/*_unsigned.shortcut
          cp shortcuts/asa-jitaku-cards.shortcut site/shortcuts/asa-jitaku-cards.shortcut
          cd site/shortcuts && zip -q asa-jitaku-cards.zip asa-jitaku-cards.shortcut && cd -

      - name: Inject patterns for cards2 variant (private secret; falls back to public placeholder if unset)
        env:
          PATTERNS_CARDS2_CHERRI: ${{ secrets.PATTERNS_CARDS2_CHERRI }}
        run: |
          python3 - <<'PYEOF'
          import os, re
          src = "shortcuts/asa_jitaku_cards2.cherri"
          patterns = os.environ.get("PATTERNS_CARDS2_CHERRI", "").lstrip("\ufeff")
          text = open(src, encoding="utf-8").read()
          if patterns.strip():
              text = re.sub(
                  r"/\* PATTERNS_START \*/.*?/\* PATTERNS_END \*/",
                  "/* PATTERNS_START */\n" + patterns + "/* PATTERNS_END */",
                  text, flags=re.S)
              print("cards2 patterns: injected from secret")
          else:
              print("cards2 patterns: secret not set, using public placeholder")
          open(src, "w", encoding="utf-8").write(text)
          PYEOF

      - name: Compile cards2 shortcut (unsigned)
        run: |
          ./cherri shortcuts/asa_jitaku_cards2.cherri --skip-sign
          ls shortcuts/*_unsigned.shortcut

      - name: Fix missing WFWorkflowName and sign cards2 variant (HubSign)
        run: |
          UNSIGNED=$(ls shortcuts/*_unsigned.shortcut | head -n1)
          python3 tools/sign_hubsign.py --input "$UNSIGNED" --output shortcuts/asa-jitaku-cards2.shortcut --name AsaJitakuCards2
          test -s shortcuts/asa-jitaku-cards2.shortcut
          python3 -c "d=open('shortcuts/asa-jitaku-cards2.shortcut','rb').read(); assert d[:4]==b'AEA1', 'not a signed shortcut file'"
          rm -f shortcuts/*_unsigned.shortcut
          cp shortcuts/asa-jitaku-cards2.shortcut site/shortcuts/asa-jitaku-cards2.shortcut
          cd site/shortcuts && zip -q asa-jitaku-cards2.zip asa-jitaku-cards2.shortcut && cd -

      - name: Compile cards2 debug shortcut (unsigned, no patterns needed)
        run: |
          ./cherri shortcuts/asa_jitaku_cards2_debug.cherri --skip-sign
          ls shortcuts/*_unsigned.shortcut

      - name: Fix missing WFWorkflowName and sign cards2 debug (HubSign)
        run: |
          UNSIGNED=$(ls shortcuts/*_unsigned.shortcut | head -n1)
          python3 tools/sign_hubsign.py --input "$UNSIGNED" --output shortcuts/asa-jitaku-cards2-debug.shortcut --name AsaJitakuCards2Debug
          test -s shortcuts/asa-jitaku-cards2-debug.shortcut
          python3 -c "d=open('shortcuts/asa-jitaku-cards2-debug.shortcut','rb').read(); assert d[:4]==b'AEA1', 'not a signed shortcut file'"
          rm -f shortcuts/*_unsigned.shortcut
          cp shortcuts/asa-jitaku-cards2-debug.shortcut site/shortcuts/asa-jitaku-cards2-debug.shortcut
          cd site/shortcuts && zip -q asa-jitaku-cards2-debug.zip asa-jitaku-cards2-debug.shortcut && cd -

      - name: Inject patterns for cards3 variant (private secret; falls back to public placeholder if unset)
        env:
          PATTERNS_CARDS3_CHERRI: ${{ secrets.PATTERNS_CARDS3_CHERRI }}
        run: |
          python3 - <<'PYEOF'
          import os, re
          src = "shortcuts/asa_jitaku_cards3.cherri"
          patterns = os.environ.get("PATTERNS_CARDS3_CHERRI", "").lstrip("\ufeff")
          text = open(src, encoding="utf-8").read()
          if patterns.strip():
              text = re.sub(
                  r"/\* PATTERNS_START \*/.*?/\* PATTERNS_END \*/",
                  "/* PATTERNS_START */\n" + patterns + "/* PATTERNS_END */",
                  text, flags=re.S)
              print("cards3 patterns: injected from secret")
          else:
              print("cards3 patterns: secret not set, using public placeholder")
          open(src, "w", encoding="utf-8").write(text)
          PYEOF

      - name: Compile cards3 shortcut (unsigned)
        run: |
          ./cherri shortcuts/asa_jitaku_cards3.cherri --skip-sign
          ls shortcuts/*_unsigned.shortcut

      - name: Fix missing WFWorkflowName and sign cards3 variant (HubSign)
        run: |
          UNSIGNED=$(ls shortcuts/*_unsigned.shortcut | head -n1)
          python3 tools/sign_hubsign.py --input "$UNSIGNED" --output shortcuts/asa-jitaku-cards3.shortcut --name AsaJitakuCards3
          test -s shortcuts/asa-jitaku-cards3.shortcut
          python3 -c "d=open('shortcuts/asa-jitaku-cards3.shortcut','rb').read(); assert d[:4]==b'AEA1', 'not a signed shortcut file'"
          rm -f shortcuts/*_unsigned.shortcut
          cp shortcuts/asa-jitaku-cards3.shortcut site/shortcuts/asa-jitaku-cards3.shortcut
          cd site/shortcuts && zip -q asa-jitaku-cards3.zip asa-jitaku-cards3.shortcut && cd -

      - name: Compile native5 shortcut (unsigned)
        run: |
          ./cherri shortcuts/asa_jitaku_native5.cherri --skip-sign
          ls shortcuts/*_unsigned.shortcut

      - name: Fix missing WFWorkflowName and sign native5 variant (HubSign)
        run: |
          UNSIGNED=$(ls shortcuts/*_unsigned.shortcut | head -n1)
          python3 tools/sign_hubsign.py --input "$UNSIGNED" --output shortcuts/asa-jitaku-native5.shortcut --name AsaJitakuNative5
          test -s shortcuts/asa-jitaku-native5.shortcut
          python3 -c "d=open('shortcuts/asa-jitaku-native5.shortcut','rb').read(); assert d[:4]==b'AEA1', 'not a signed shortcut file'"
          rm -f shortcuts/*_unsigned.shortcut
          cp shortcuts/asa-jitaku-native5.shortcut site/shortcuts/asa-jitaku-native5.shortcut
          cd site/shortcuts && zip -q asa-jitaku-native5.zip asa-jitaku-native5.shortcut && cd -

      - name: Assemble site
        run: |
          if [ -d web ]; then
            cp -r web/. site/
            echo "web/ found and copied (design managed outside this pipeline)."
          else
            echo "no web/ directory in this repo yet — skipping (Pages will only serve site/shortcuts/ until a web/ is added separately)."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
