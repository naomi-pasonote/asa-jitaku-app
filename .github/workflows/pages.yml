name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cherri
        run: |
          curl -fsSL -o cherri.zip https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip
          unzip -q cherri.zip
          chmod +x cherri

      - name: Compile shortcut
        run: |
          ./cherri shortcuts/asa_jitaku_renkei.cherri --debug --skip-sign
          echo "Compiled files:"
          find shortcuts -maxdepth 1 -type f -print

      - name: Sign shortcut with HubSign
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, sys
          candidates = list(pathlib.Path("shortcuts").glob("*_unsigned.shortcut"))
          if not candidates:
              print("Unsigned shortcut was not produced")
              sys.exit(1)
          src = candidates[0]
          dst = pathlib.Path("shortcuts/asa_jitaku_renkei.shortcut")
          payload = json.dumps({
              "shortcutName": "asa_jitaku_renkei",
              "shortcut": src.read_text(encoding="utf-8")
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://hubsign.routinehub.services/sign",
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "cherri/2.3.0",
                  "Origin": "https://routinehub.co",
                  "Referer": "https://routinehub.co/"
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = r.read()
          except Exception as e:
              print("HubSign request failed:", repr(e))
              sys.exit(1)
          if not body.startswith(b"AEA1"):
              print("HubSign response was not a signed shortcut")
              sys.exit(1)
          dst.write_bytes(body)
          print("Signed shortcut created:", len(body), "bytes")
          PY

      - name: Assemble site
        run: |
          mkdir -p site/shortcuts
          cp shortcuts/asa_jitaku_renkei.shortcut site/shortcuts/AsaJitakuLink2.shortcut
          cp shortcuts/asa_jitaku_renkei.shortcut "site/shortcuts/AsaJitakuLink2.shortcut"
          (cd site/shortcuts && zip -q AsaJitakuLink2.zip "AsaJitakuLink2.shortcut")
          cp -r web/. site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
