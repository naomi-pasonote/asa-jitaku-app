name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cherri
        run: |
          curl -fsSL -o cherri.zip https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip
          unzip -q cherri.zip
          chmod +x cherri

      - name: Inject patterns (private secret; falls back to public placeholder if unset)
        env:
          PATTERNS_CHERRI: ${{ secrets.PATTERNS_CHERRI }}
        run: |
          python3 - <<'PYEOF'
          import os, re
          src = "shortcuts/asa_jitaku_native.cherri"
          patterns = os.environ.get("PATTERNS_CHERRI", "")
          text = open(src, encoding="utf-8").read()
          if patterns.strip():
              text = re.sub(
                  r"/\* PATTERNS_START \*/.*?/\* PATTERNS_END \*/",
                  "/* PATTERNS_START */\n" + patterns + "    /* PATTERNS_END */",
                  text, flags=re.S)
              print("patterns: injected from secret")
          else:
              print("patterns: secret not set, using public placeholder")
          open(src, "w", encoding="utf-8").write(text)
          PYEOF

      - name: Compile shortcut (unsigned)
        run: |
          mkdir -p site/shortcuts
          ./cherri shortcuts/asa_jitaku_native.cherri --skip-sign
          ls shortcuts/*_unsigned.shortcut

      - name: Fix missing WFWorkflowName and sign (HubSign)
        run: |
          UNSIGNED=$(ls shortcuts/*_unsigned.shortcut | head -n1)
          python3 tools/sign_hubsign.py --input "$UNSIGNED" --output shortcuts/asa-jitaku-native.shortcut --name AsaJitakuNative4
          test -s shortcuts/asa-jitaku-native.shortcut
          python3 -c "d=open('shortcuts/asa-jitaku-native.shortcut','rb').read(); assert d[:4]==b'AEA1', 'not a signed shortcut file'"
          cp shortcuts/asa-jitaku-native.shortcut site/shortcuts/asa-jitaku-native.shortcut
          cd site/shortcuts && zip -q asa-jitaku-native.zip asa-jitaku-native.shortcut && cd -

      - name: Assemble site
        run: cp -r web/. site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4