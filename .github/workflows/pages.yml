name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cherri
        run: |
          curl -fsSL -o cherri.zip https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip
          unzip -q cherri.zip
          chmod +x cherri

      - name: Compile shortcuts (unsigned)
        run: |
          mkdir -p site/shortcuts
          ./cherri shortcuts/asa_jitaku_renkei.cherri --skip-sign
          ./cherri shortcuts/asa_jitaku_native.cherri --skip-sign
          ls shortcuts/*_unsigned.shortcut

      - name: Sign share-sheet shortcut
        run: |
          UNSIGNED=shortcuts/AsaJitakuShare2_unsigned.shortcut
          python3 tools/sign_hubsign.py --share-sheet --input "$UNSIGNED" --output shortcuts/AsaJitakuShare2.shortcut --name AsaJitakuShare2
          test -s shortcuts/AsaJitakuShare2.shortcut
          python3 -c "d=open('shortcuts/AsaJitakuShare2.shortcut','rb').read(); assert d[:4]==b'AEA1'"
          cp shortcuts/AsaJitakuShare2.shortcut site/shortcuts/AsaJitakuShare2.shortcut
          cd site/shortcuts && zip -q AsaJitakuShare2.zip AsaJitakuShare2.shortcut && cd -

      - name: Sign standalone native shortcut
        run: |
          UNSIGNED=shortcuts/AsaJitakuNative_unsigned.shortcut
          python3 tools/sign_hubsign.py --input "$UNSIGNED" --output shortcuts/AsaJitakuNative.shortcut --name AsaJitakuNative
          test -s shortcuts/AsaJitakuNative.shortcut
          python3 -c "d=open('shortcuts/AsaJitakuNative.shortcut','rb').read(); assert d[:4]==b'AEA1'"
          cp shortcuts/AsaJitakuNative.shortcut site/shortcuts/AsaJitakuNative.shortcut
          cd site/shortcuts && zip -q AsaJitakuNative.zip AsaJitakuNative.shortcut && cd -

      - name: Assemble site
        run: cp -r web/. site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4